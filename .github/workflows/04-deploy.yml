# This workflow completes the story by delivering the saved package.
# It starts after the build workflow finishes successfully.
name: 04 Deploy Workflow

on:
  workflow_run:
    workflows: ["03 Build Artifact Workflow"]
    types: [completed]


env:
  IMAGE_NAME: tiny-health-app
  IMAGE_TAR: tiny-health-app.tar
  IMAGE_METADATA: image-metadata.env
  ARTIFACT_NAME: tiny-health-app-image
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"


permissions:
  actions: read
  contents: read


jobs:
  deploy-package:

    # Continue only when the build workflow succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest


    steps:

      - name: Download build artifact
        # Download the exact artifact produced by the build run.
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-artifact


      - name: Show downloaded files
        run: ls -R downloaded-artifact


      - name: Load Docker image
        # Restore the Docker image from the build artifact.
        run: docker load --input "downloaded-artifact/${IMAGE_TAR}"


      - name: Read image metadata from build artifact
        # Read the exact image tag created by the build workflow.
        id: image-metadata
        run: |
          source "downloaded-artifact/${IMAGE_METADATA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_reference=${IMAGE_REFERENCE}" >> "$GITHUB_OUTPUT"


      - name: Show exact date-plus-run-id image tag
        # Show the exact image reference recreated from the build run.
        run: |
          echo "Build Run ID:"
          echo "${{ github.event.workflow_run.id }}"

          echo "Image tag:"
          echo "${{ steps.image-metadata.outputs.image_tag }}"

          echo "Full image reference:"
          echo "${{ steps.image-metadata.outputs.image_reference }}"


      - name: Start container
        # Run the exact image created by the build workflow.
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p "${APP_PORT}:8000" \
            "${{ steps.image-metadata.outputs.image_reference }}"


      - name: Show running containers
        # Display the deployed container.
        run: docker ps


      - name: Smoke test deployed app
        # Wait until the application becomes available.
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent "http://127.0.0.1:${APP_PORT}/health"; then
              exit 0
            fi

            echo "Waiting for app to become ready..."
            sleep 2
          done

          echo "App did not become ready in time."
          exit 1


      - name: Print health response body
        # Show the actual API response.
        run: |
          echo "Health response:"
          curl --silent "http://127.0.0.1:${APP_PORT}/health"


      - name: Stop container
        if: always()
        # Cleanup after deployment test.
        run: docker rm -f "${CONTAINER_NAME}" || true
