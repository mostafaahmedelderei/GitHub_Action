# This is the first real CI workflow in the course.
# It verifies code changes by running tests and security scans on a fresh runner.

name: 02 CI Workflow

on:
  # Run CI before merging pull requests into main.
  pull_request:
    branches:
      - main

  # Allow manual execution from Actions tab.
  workflow_dispatch:


jobs:
  run-tests:

    # The runner is the temporary machine that executes the steps below.
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        # Download repository files to the runner.
        uses: actions/checkout@v6


      - name: Set up Python
        # Prepare Python environment on the runner.
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install Ruff
        # Install ruff linter for code quality checks.
        run: pip install ruff


      - name: Run Ruff lint
        # Check Python code style and detect common issues.
        run: ruff check .


      - name: Run tests
        # Verify application correctness.
        run: python -m unittest discover -s tests -v


      - name: Create artifact
        # Package application files into an artifact.
        run: |
          mkdir artifact
          cp -r app artifact/
          cp -r tests artifact/
          cp Dockerfile artifact/


      - name: Upload artifact
        # Store artifact so it can be used in later steps/jobs.
        uses: actions/upload-artifact@v4
        with:
          name: application-artifact
          path: artifact/


      - name: Download artifact
        # Download the artifact before scanning it.
        uses: actions/download-artifact@v4
        with:
          name: application-artifact
          path: downloaded-artifact/


      - name: Run Trivy artifact filesystem scan
        # Scan the created artifact instead of the source repository.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: downloaded-artifact/
          severity: CRITICAL,HIGH
          exit-code: 1


      - name: Run Trivy Dockerfile scan
        # Scan Dockerfile inside the artifact.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: downloaded-artifact/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: 1
