# This is the first real CI workflow in the course.
# It verifies a change by running tests on a fresh runner.

name: 02 CI Workflow

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/02-ci.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 10 * * *"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    # Create two copies of the same job automatically
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check repo
        run: ls

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Uses the current matrix version
          python-version: ${{ matrix.python-version }}

      - name: Check python
        run: python --version

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Show runner information
        run: |
          echo "Python version: ${{ matrix.python-version }}"
          date
