# This is the first real CI workflow in the course.
# It verifies code changes by running tests and security scans on a fresh runner.

name: 02 CI Workflow

on:
  # Run CI before merging pull requests into main.
  pull_request:
    branches:
      - main

  # Allow manual execution from Actions tab.
  workflow_dispatch:


jobs:
  run-tests:

    # The runner is the temporary machine that executes the steps below.
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        # Download repository files to the runner.
        uses: actions/checkout@v6


      - name: Set up Python
        # Prepare Python environment on the runner.
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install Ruff
        # Install ruff linter for code quality checks.
        run: pip install ruff


      - name: Run Ruff lint
        # Check Python code style and detect common issues.
        run: ruff check .


      - name: Run tests
        # Verify application correctness.
        run: python -m unittest discover -s tests -v


      - name: Run Trivy filesystem scan
        # Scan the repository filesystem for vulnerabilities.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1


      - name: Run Trivy Dockerfile scan
        # Scan Dockerfile and container configuration issues.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: CRITICAL,HIGH
          exit-code: 1
          
